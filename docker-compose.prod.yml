# Production stack for the Oracle Cloud VM (see DEPLOY_ORACLE.md).
# Two containers: `app` (Fastify = API + WebSocket + static SPA on :4000) and `caddy`
# (TLS termination + reverse proxy). Postgres stays external (Neon) via DATABASE_URL.
#
#   DOMAIN is read from the root ./.env   (echo "DOMAIN=<name>.duckdns.org" > .env)
#   App secrets live in ./.env.prod       (copied from .env.prod.example, chmod 600)
#
# Launch:  docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build: .                      # reuse the existing multi-stage root Dockerfile
    env_file: ./.env.prod         # secrets (DATABASE_URL, JWT_SECRET, ...) — VM only, NOT in git
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in ./.env}
    mem_limit: 512m               # a leak restarts only app, not the whole 1 GB box
    restart: unless-stopped
    # No "ports:" on purpose — only Caddy is public; it reaches app:4000 on the Docker network.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in ./.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data           # keeps the Let's Encrypt cert across restarts — don't delete
      - caddyconfig:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
